<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Certificates — SwissTrust</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../lib/supabase.js"></script>
  <script src="../lib/i18n.js"></script>
</head>
<body>

<nav class="nav">
  <div class="container flex-between w-full">
    <a href="../index.html" class="nav__logo">
      <div class="nav__logo-mark">ST</div>
      SwissTrust
    </a>
    <div class="nav__links">
      <span class="text-sm text-gray" id="nav-name"></span>
      <button onclick="sbHelpers.signOut()" class="btn btn-ghost btn-sm">Sign out</button>
    </div>
  </div>
</nav>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar__section">
      <div class="sidebar__label">My dossier</div>
      <a href="dashboard.html" class="sidebar__link"><span class="sidebar__icon">⊞</span> Dashboard</a>
      <a href="profile.html" class="sidebar__link"><span class="sidebar__icon">◎</span> My profile</a>
      <a href="documents.html" class="sidebar__link"><span class="sidebar__icon">📄</span> Documents</a>
    </div>
    <div class="sidebar__section">
      <div class="sidebar__label">Certificates</div>
      <a href="certificates.html" class="sidebar__link sidebar__link--active"><span class="sidebar__icon">🪪</span> My certificates</a>
      <a href="certificate-new.html" class="sidebar__link"><span class="sidebar__icon">＋</span> New certificate</a>
    </div>
  </aside>

  <main class="main-content">
    <div class="flex-between mb-24">
      <div>
        <div class="page-title">My certificates</div>
        <div class="page-subtitle">One certificate per property. Share the QR code or manual code with your agency.</div>
      </div>
      <a href="certificate-new.html" class="btn btn-primary">+ New certificate</a>
    </div>

    <div id="certs-list"></div>

    <div class="card card--flat" style="background:var(--gray-100); text-align:center; padding:40px;">
      <div style="font-size:2rem; margin-bottom:12px; opacity:.4;">＋</div>
      <div class="text-sm text-gray mb-16">Applying to another property?</div>
      <a href="certificate-new.html" class="btn btn-primary btn-sm">Create new certificate</a>
    </div>
  </main>
</div>

<script>
const modeLabels = { directed: 'Directed', open: 'Open', on_request: 'On-Request' };
const modeColors = { directed: 'var(--charcoal)', open: 'var(--green)', on_request: 'var(--amber)' };

const VIEWER_LABEL = { public: 'Anonymous scan', agency: 'Agency login', owner: 'Owner login', tenant: 'You (owner)' };
const VIEWER_ICON  = { public: '👁', agency: '🏢', owner: '👤', tenant: '🪪' };

(async () => {
  const user = await sbHelpers.requireAuth('tenant');
  if (!user) return;

  document.getElementById('nav-name').textContent = user.user_metadata?.full_name || user.email;

  const { data: tenant } = await sbHelpers.getTenantByUserId(user.id);
  if (!tenant) return;

  const { data: certs, error } = await sbHelpers.getCertificatesByTenant(tenant.id);
  const list = document.getElementById('certs-list');

  if (error || !certs || certs.length === 0) {
    list.innerHTML = `
      <div class="card mb-24" style="text-align:center; padding:40px;">
        <div style="font-size:2rem; margin-bottom:12px; opacity:.4;">🪪</div>
        <div class="text-sm text-gray mb-16">No certificates yet. Generate one when you find a property.</div>
        <a href="certificate-new.html" class="btn btn-primary btn-sm">New certificate →</a>
      </div>`;
    return;
  }

  list.innerHTML = certs.map(c => {
    const trustClass = { A: 'trust-a', B: 'trust-b', C: 'trust-c' }[c.trust_score] || 'trust-b';
    const borderColor = { A: 'var(--green)', B: 'var(--amber)', C: 'var(--red)' }[c.trust_score] || 'var(--gray-200)';
    const agencyName = c.agencies?.company_name;
    const ownerEmail = c.owner_email;
    const date = new Date(c.created_at).toLocaleDateString('en-CH', { day:'2-digit', month:'short', year:'numeric' });
    const mode = c.mode || 'directed';

    let recipientHtml;
    if (agencyName) {
      recipientHtml = `<div><div class="text-xs text-gray mb-4">Directed to</div><div class="text-sm font-bold">${agencyName}</div></div>`;
    } else if (ownerEmail) {
      recipientHtml = `<div><div class="text-xs text-gray mb-4">Directed to</div><div class="text-sm font-bold">${escHtml(ownerEmail)}</div></div>`;
    } else {
      recipientHtml = `<div><div class="text-xs text-gray mb-4">Mode</div><div class="text-sm font-bold">${modeLabels[mode]}</div></div>`;
    }

    return `
      <div class="card mb-16" style="border-left: 3px solid ${borderColor};">
        <div class="flex-between mb-16">
          <div>
            <div style="font-weight:700; font-size:1rem;">${c.property_address || '—'}${c.property_city ? ', ' + c.property_city : ''}</div>
            <div class="text-sm text-gray mt-4">${c.rooms ? c.rooms + ' rooms' : ''}${c.floor ? ' · Floor ' + c.floor : ''}${c.total_chf ? ' · CHF ' + Number(c.total_chf).toLocaleString() + '/mo' : ''}${c.move_in_date ? ' · Move-in ' + new Date(c.move_in_date).toLocaleDateString('de-CH') : ''}</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
            <span class="badge ${trustClass}">${c.trust_score || '—'}</span>
            <span class="badge badge-green">Active</span>
            <span class="badge" style="background:var(--gray-100); color:${modeColors[mode]}; font-weight:600;">${modeLabels[mode]}</span>
          </div>
        </div>
        <div class="flex-between" style="flex-wrap:wrap; gap:12px; margin-bottom:16px;">
          <div>
            <div class="text-xs text-gray mb-4">Certificate code</div>
            <div class="font-mono font-bold" style="font-size:1.1rem; letter-spacing:.08em;">${c.cert_code}</div>
          </div>
          ${recipientHtml}
          <div>
            <div class="text-xs text-gray mb-4">Created</div>
            <div class="text-sm">${date}</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <a href="../cert/cert-view.html?code=${c.cert_code}" class="btn btn-outline btn-sm">View certificate</a>
            <button class="btn btn-ghost btn-sm" onclick="copyCode('${c.cert_code}', this)">Copy code</button>
          </div>
        </div>
        <!-- Access log toggle -->
        <div style="border-top:1px solid var(--gray-200); padding-top:12px;">
          <button class="btn btn-ghost btn-sm" style="font-size:.8rem; color:var(--gray-400);"
            onclick="toggleLog('${c.id}', this)">📋 Show access log</button>
          <div id="log-${c.id}" style="display:none; margin-top:12px;"></div>
        </div>
      </div>`;
  }).join('');
})();

async function toggleLog(certId, btn) {
  const panel = document.getElementById(`log-${certId}`);
  if (panel.style.display !== 'none') {
    panel.style.display = 'none';
    btn.textContent = '📋 Show access log';
    return;
  }
  btn.textContent = 'Loading…';
  btn.disabled = true;

  const { data: logs, error } = await sbHelpers.getAccessLogsByCertificate(certId);

  btn.textContent = '📋 Hide access log';
  btn.disabled = false;
  panel.style.display = 'block';

  if (error || !logs || logs.length === 0) {
    panel.innerHTML = `<div class="text-sm text-gray" style="padding:8px 0;">No access events recorded yet.</div>`;
    return;
  }

  panel.innerHTML = `
    <div style="font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-400); margin-bottom:8px;">
      Last ${logs.length} access event${logs.length > 1 ? 's' : ''}
    </div>` +
    logs.map(log => {
      const when = new Date(log.accessed_at).toLocaleString('en-CH', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
      const icon  = VIEWER_ICON[log.viewer_type]  || '👁';
      const label = VIEWER_LABEL[log.viewer_type] || log.viewer_type;
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--gray-100); font-size:.8125rem;">
          <span style="flex-shrink:0; font-size:1rem;">${icon}</span>
          <span style="flex:1; color:var(--charcoal);">${label}</span>
          <span style="color:var(--gray-400); white-space:nowrap;">${when}</span>
        </div>`;
    }).join('');
}

function copyCode(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function escHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
